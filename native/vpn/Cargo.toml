[package]
name = "tiernest-vpn"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "LGPL-3.0-only"
publish = false

[lib]
name = "tiernest_vpn"
crate-type = ["cdylib"]

[dependencies]
easytier = { git = "https://github.com/EasyTier/EasyTier.git", rev = "8428a89d2dabc94c97d370ec607c6ca142473626" }
jni = "=0.21.1"
once_cell = "1.18"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
panic = "abort"
